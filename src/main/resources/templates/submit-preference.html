<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Preference Submission - TA Allocator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-body);
            line-height: 1.5;
            padding: 32px 16px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .nav-back:hover { color: var(--primary); }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
            padding: 32px;
        }

        .header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-heading);
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .alert {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: 6px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            font-size: 0.9rem;
            font-family: inherit;
            background: #fff;
            color: var(--text-body);
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-helper {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-top: 12px;
        }

        .btn-submit:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>

<div class="container">
    <a th:href="@{/}" class="nav-back">← Back to Admin Dashboard</a>

    <div class="card">
        <div class="header">
            <h1>Department TA Preference Portal</h1>
            <p>IIT Madras - Department of Aerospace Engineering</p>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form method="POST" th:action="@{/preferences/submit}">
            <div class="form-group">
                <label class="form-label">Select Course</label>
                <select name="courseNo" class="form-select" required>
                    <option value="">-- Choose Course --</option>
                    <option th:each="course : ${courses}" 
                            th:value="${course.courseNo}" 
                            th:text="${course.courseNo + ' - ' + course.courseName + ' (' + course.instructorName + ')'}"></option>
                </select>
                <p class="form-helper">Select the class you are handling this semester.</p>
            </div>

            <div class="form-group">
                <label class="form-label">Faculty Name</label>
                <input type="text" name="facultyName" class="form-input" placeholder="e.g. Dr. Bharath Govindarajan" required />
            </div>

            <div class="form-group">
                <label class="form-label">Faculty Email (Optional)</label>
                <input type="email" name="facultyEmail" class="form-input" placeholder="e.g. bharath@aerospace.iitm.ac.in" />
            </div>

            <div style="margin: 28px 0 16px 0; border-top: 1px dashed var(--border); padding-top: 16px;">
                <h3 style="font-size: 1.05rem; font-weight: 700; color: var(--text-heading); margin-bottom: 4px;">Ranked TA Preferences</h3>
                <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px;">Choice 1 receives highest weighting (10,000 points) down to Choice 4 (2,500 points).</p>

                <!-- Choice 1 -->
                <div class="form-group">
                    <label class="form-label">TA Preference 1 (Top Choice)</label>
                    <select name="pref1" class="form-select" required>
                        <option value="No preference. You choose for me.">No preference. You choose for me.</option>
                        <option value="I do not want TAs.">I do not want TAs.</option>
                        <option th:each="st : ${students}" 
                                th:value="${st.rollNo + ': ' + st.name + (st.cgpa != null ? ' [' + st.cgpa + ']' : '') + (st.program != null ? ' (' + st.program + ')' : '')}" 
                                th:text="${st.rollNo + ': ' + st.name + (st.cgpa != null ? ' [' + st.cgpa + ']' : '') + (st.program != null ? ' (' + st.program + ')' : '')}"></option>
                    </select>
                </div>

                <!-- Choice 2 -->
                <div class="form-group">
                    <label class="form-label">TA Preference 2</label>
                    <select name="pref2" class="form-select">
                        <option value="">-- None --</option>
                        <option value="No preference. You choose for me.">No preference. You choose for me.</option>
                        <option value="I do not want TAs.">I do not want TAs.</option>
                        <option th:each="st : ${students}" 
                                th:value="${st.rollNo + ': ' + st.name + (st.cgpa != null ? ' [' + st.cgpa + ']' : '') + (st.program != null ? ' (' + st.program + ')' : '')}" 
                                th:text="${st.rollNo + ': ' + st.name + (st.cgpa != null ? ' [' + st.cgpa + ']' : '') + (st.program != null ? ' (' + st.program + ')' : '')}"></option>
                    </select>
                </div>

                <!-- Choice 3 -->
                <div class="form-group">
                    <label class="form-label">TA Preference 3</label>
                    <select name="pref3" class="form-select">
                        <option value="">-- None --</option>
                        <option value="No preference. You choose for me.">No preference. You choose for me.</option>
                        <option value="I do not want TAs.">I do not want TAs.</option>
                        <option th:each="st : ${students}" 
                                th:value="${st.rollNo + ': ' + st.name + (st.cgpa != null ? ' [' + st.cgpa + ']' : '') + (st.program != null ? ' (' + st.program + ')' : '')}" 
                                th:text="${st.rollNo + ': ' + st.name + (st.cgpa != null ? ' [' + st.cgpa + ']' : '') + (st.program != null ? ' (' + st.program + ')' : '')}"></option>
                    </select>
                </div>

                <!-- Choice 4 -->
                <div class="form-group">
                    <label class="form-label">TA Preference 4</label>
                    <select name="pref4" class="form-select">
                        <option value="">-- None --</option>
                        <option value="No preference. You choose for me.">No preference. You choose for me.</option>
                        <option value="I do not want TAs.">I do not want TAs.</option>
                        <option th:each="st : ${students}" 
                                th:value="${st.rollNo + ': ' + st.name + (st.cgpa != null ? ' [' + st.cgpa + ']' : '') + (st.program != null ? ' (' + st.program + ')' : '')}" 
                                th:text="${st.rollNo + ': ' + st.name + (st.cgpa != null ? ' [' + st.cgpa + ']' : '') + (st.program != null ? ' (' + st.program + ')' : '')}"></option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit">Submit Preferences</button>
        </form>
    </div>
</div>

</body>
</html>
